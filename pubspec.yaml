name: weathernow
description: "WeatherNow - Take-home challenge (Webol) - Flutter + Riverpod + Clean Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Local database / caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity (offline detection)
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.2.0

  # Dependency Injection (service locator)
  get_it: ^7.7.0

  # Image caching
  cached_network_image: ^3.3.1

  # Value equality for entities/states (Failure, Entities)
  equatable: ^2.0.5

  # Functional error handling (Either<Failure, T>)
  dartz: ^0.10.1

  # Env / secrets - keep API key out of committed code
  flutter_dotenv: ^5.1.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/env/.env
